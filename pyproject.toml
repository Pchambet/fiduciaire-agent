[project]
name = "fiduciaire-agent"
version = "0.1.0"
authors = [
    { name = "Pierre Chambet", email = "pierrechambet@gmail.com" }
]
description = "Swiss pre-accounting: QR-bills and camt.053 statements in, deterministic controls, an LLM agent that classifies over MCP, a human who approves"
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.2",
]

[project.scripts]
fidu = "fiduciaire_agent:main"
fidu-mcp = "fiduciaire_agent.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

# ruff defaults (version locked in uv.lock) + imports, bugbear, pyupgrade, simplify
[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]

[tool.pyright]
venvPath = "."
venv = ".venv"
