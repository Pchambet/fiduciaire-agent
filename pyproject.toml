[project]
name = "fiduciaire-agent"
version = "0.1.0"
authors = [
    { name = "Pierre Chambet", email = "pierrechambet@gmail.com" }
]
description = "Pré-comptabilité suisse : QR-factures et relevés camt.053, un agent Claude qui classe par MCP, un humain qui valide"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.2",
]

[project.scripts]
fidu = "fiduciaire_agent:main"
fidu-mcp = "fiduciaire_agent.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

# ruff defaults (version locked in uv.lock) + imports, bugbear, pyupgrade, simplify
[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]

# Let Pyright / the editor find the project's .venv (else "import pytest could not be resolved")
[tool.pyright]
venvPath = "."
venv = ".venv"
