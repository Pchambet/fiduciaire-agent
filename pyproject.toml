[project]
name = "fiduciaire-agent"
version = "0.1.0"
authors = [
    { name = "Pierre_Chambet", email = "pierrechambet@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
fiduciaire-agent = "fiduciaire_agent:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

# ruff defaults (version locked in uv.lock) + imports, bugbear, pyupgrade, simplify
[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]

# Let Pyright / the editor find the project's .venv (else "import pytest could not be resolved")
[tool.pyright]
venvPath = "."
venv = ".venv"
